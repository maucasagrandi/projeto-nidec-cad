[project]
name = "poc-genai-ls-engenharia"
version = "0.1.0"
description = "Comparação de CAD com GenAI"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.38.0",
    "streamlit-image-zoom==0.0.4",
    "pymupdf==1.25.1",
    "Pillow==10.4.0",
    "google-auth==2.35.0",
    "google-cloud-aiplatform==1.70.0",
    "google-genai>=1.0.0",
    "python-dotenv==1.0.1",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
